<!doctype html>
<html lang="es" data-theme="ethereal">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#060b1e" />
    <script>
      (() => {
        const allowedThemes = ['ethereal', 'tokyo-night', 'osaka-jade', 'gruvbox', 'flexoki-light'];
        let theme = 'ethereal';
        try {
          const saved = localStorage.getItem('devcode-omarchy-theme-v2');
          const previous = localStorage.getItem('devcode-omarchy-theme') || localStorage.getItem('devcode-theme');
          if (allowedThemes.includes(saved)) theme = saved;
          else if (previous === 'light') theme = 'flexoki-light';
          else if (previous === 'tokyo-night') theme = 'ethereal';
          else if (allowedThemes.includes(previous)) theme = previous;
          localStorage.setItem('devcode-omarchy-theme-v2', theme);
        } catch {}
        document.documentElement.dataset.theme = theme;
        document.documentElement.style.colorScheme = theme === 'flexoki-light' ? 'light' : 'dark';
      })();
    </script>
    <title>Samael Medina · Full Stack</title>
    <meta name="description" content="Portafolio de Samael Medina, desarrollador Full Stack en Tijuana, México. Sistemas web con TypeScript, React, Next.js, Express y PostgreSQL." />
    <meta name="author" content="Samael Medina" />
    <meta name="robots" content="index, follow" />
    <meta name="color-scheme" content="dark light" />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="es_MX" />
    <meta property="og:title" content="Samael Medina · Full Stack" />
    <meta property="og:description" content="Desarrollo web desde Tijuana, México. Conoce mis proyectos, experiencia y herramientas." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;450;500;600;700&family=Geist:wght@400;500;600;700&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
